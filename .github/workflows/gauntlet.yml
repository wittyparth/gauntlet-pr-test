name: gauntlet
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gauntlet:
    runs-on: self-hosted
    env:
      AGENT_TOOLSDIRECTORY: /Users/parthu/gauntlet-runner/_tool
    steps:
      - uses: actions/checkout@v7
      - name: Python 3.12 venv on PATH
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/py" -q
          uv pip install --python "$RUNNER_TEMP/py/bin/python" pip -q
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - uses: wittyparth/gauntlet/integrations/github-action@main
        with:
          api-url: http://localhost:8088
          api-key: ${{ secrets.GAUNTLET_API_KEY }}
          suite: ecommerce_tiny
          agent-version: agv_01M85WHBSG901TJZ57D5ZR7Z1B
          repetitions: 1
          budget-usd: 0.03
          timeout-min: 10
          setup-python: "false"
          cli-spec: >-
            gauntlet-core @ git+https://github.com/wittyparth/gauntlet@main#subdirectory=packages/core
            gauntlet-cli @ git+https://github.com/wittyparth/gauntlet@main#subdirectory=packages/cli
